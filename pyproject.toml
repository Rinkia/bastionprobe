[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Pentest for AI agents: fire indirect prompt-injection payloads at your agent and report which land. Offensive twin of agentbastion."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Rizzello", email = "rizzellostefano@gmail.com" }]
keywords = ["llm", "security", "prompt-injection", "ai-agent", "pentest", "red-team", "agent-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agentprobe = "agentprobe.cli:main"

[project.urls]
Homepage = "https://github.com/Rinkia/agentprobe"
Repository = "https://github.com/Rinkia/agentprobe"
Issues = "https://github.com/Rinkia/agentprobe/issues"

[tool.setuptools]
packages = ["agentprobe"]

[tool.setuptools.package-data]
agentprobe = ["payloads.jsonl"]
